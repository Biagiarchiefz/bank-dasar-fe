<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Keep the subject inside x 450–1150, y 200–800 so both crops show it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3E7"/>
      <stop offset="1" stop-color="#F6D9BF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1250" cy="200" r="330" fill="#F59E0B" opacity="0.12"/>
  <circle cx="330" cy="860" r="380" fill="#EA580C" opacity="0.08"/>
  <circle cx="800" cy="520" r="340" fill="#fff" opacity="0.45"/>

  <!-- rack back bar -->
  <rect x="540" y="450" width="520" height="40" rx="20" fill="#B45309" opacity="0.85"/>

  <!-- tubes -->
  <g stroke="#E8C9AC" stroke-width="6">
    <rect x="600" y="290" width="74" height="360" rx="37" fill="#fff"/>
    <rect x="713" y="290" width="74" height="360" rx="37" fill="#fff"/>
    <rect x="826" y="290" width="74" height="360" rx="37" fill="#fff"/>
    <rect x="939" y="290" width="74" height="360" rx="37" fill="#fff"/>
  </g>
  <rect x="609" y="440" width="56" height="200" rx="28" fill="#DC2626"/>
  <rect x="722" y="380" width="56" height="260" rx="28" fill="#B91C1C"/>
  <rect x="835" y="500" width="56" height="140" rx="28" fill="#EF4444"/>
  <rect x="948" y="410" width="56" height="230" rx="28" fill="#991B1B"/>
  <g fill="#fff" opacity="0.5">
    <rect x="620" y="460" width="12" height="80" rx="6"/>
    <rect x="733" y="400" width="12" height="80" rx="6"/>
    <rect x="846" y="520" width="12" height="60" rx="6"/>
    <rect x="959" y="430" width="12" height="80" rx="6"/>
  </g>

  <!-- rack front -->
  <rect x="540" y="560" width="520" height="44" rx="22" fill="#C2410C"/>
  <rect x="520" y="690" width="560" height="56" rx="28" fill="#9A3412"/>
  <rect x="570" y="600" width="26" height="100" rx="10" fill="#9A3412"/>
  <rect x="1004" y="600" width="26" height="100" rx="10" fill="#9A3412"/>

  <!-- check badge -->
  <circle cx="1085" cy="300" r="62" fill="#fff"/>
  <path d="M1058 302 L1078 322 L1114 284" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="300" r="14" fill="#F59E0B" opacity="0.6"/>
  <circle cx="1130" cy="760" r="10" fill="#EA580C" opacity="0.5"/>
</svg>
