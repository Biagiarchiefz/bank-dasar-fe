<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Keep the subject inside x 450–1150, y 200–800 so both the wide hero crop and the portrait card crop show it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2E"/>
      <stop offset="0.55" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#6B1013"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <clipPath id="bag"><rect x="660" y="330" width="280" height="390" rx="72"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1330" cy="140" r="400" fill="#fff" opacity="0.07"/>
  <circle cx="230" cy="930" r="440" fill="#000" opacity="0.12"/>
  <circle cx="800" cy="520" r="360" fill="#fff" opacity="0.06"/>
  <circle cx="800" cy="520" r="250" fill="#fff" opacity="0.05"/>

  <!-- tube -->
  <path d="M800 300 C800 190 980 200 1040 120" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
  <rect x="772" y="280" width="56" height="64" rx="16" fill="#fff"/>

  <!-- bag -->
  <rect x="660" y="330" width="280" height="390" rx="72" fill="#fff"/>
  <g clip-path="url(#bag)">
    <path d="M640 470 C720 440 780 500 860 470 C910 452 940 460 960 470 V740 H640 Z" fill="url(#blood)"/>
  </g>
  <rect x="705" y="365" width="190" height="76" rx="18" fill="#FEE2E2"/>
  <text x="800" y="417" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800" fill="#991B1B">O+</text>
  <rect x="725" y="600" width="150" height="14" rx="7" fill="#fff" opacity="0.55"/>
  <rect x="725" y="630" width="100" height="14" rx="7" fill="#fff" opacity="0.4"/>

  <!-- floating drops and heart -->
  <path transform="translate(545 390)" d="M0 -46 C20 -16 34 2 34 20 A34 34 0 0 1 -34 20 C-34 2 -20 -16 0 -46 Z" fill="#fff" opacity="0.9"/>
  <path transform="translate(1065 560) scale(0.7)" d="M0 -46 C20 -16 34 2 34 20 A34 34 0 0 1 -34 20 C-34 2 -20 -16 0 -46 Z" fill="#FECACA"/>
  <path transform="translate(1040 330)" d="M0 30 C-60 -10 -50 -60 -18 -60 C-6 -60 0 -50 0 -42 C0 -50 6 -60 18 -60 C50 -60 60 -10 0 30 Z" fill="#fff"/>
  <circle cx="520" cy="660" r="12" fill="#fff" opacity="0.6"/>
  <circle cx="1110" cy="740" r="9" fill="#fff" opacity="0.5"/>
</svg>
