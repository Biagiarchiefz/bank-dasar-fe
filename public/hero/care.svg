<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Keep the subject inside x 450–1150, y 200–800 so both crops show it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7F6EF"/>
      <stop offset="1" stop-color="#C9E9DA"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="360" fill="#10B981" opacity="0.09"/>
  <circle cx="1320" cy="880" r="400" fill="#0EA5E9" opacity="0.08"/>
  <circle cx="800" cy="520" r="340" fill="#fff" opacity="0.5"/>

  <!-- IV stand -->
  <path d="M700 240 H900" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <path d="M800 240 V800" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <path d="M680 800 H920" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
  <circle cx="690" cy="815" r="14" fill="#334155"/>
  <circle cx="910" cy="815" r="14" fill="#334155"/>

  <!-- bag -->
  <path d="M740 240 V268" stroke="#334155" stroke-width="8"/>
  <rect x="650" y="265" width="180" height="250" rx="48" fill="#fff"/>
  <rect x="664" y="360" width="152" height="140" rx="38" fill="#DC2626"/>
  <rect x="690" y="292" width="100" height="40" rx="12" fill="#FEE2E2"/>
  <rect x="726" y="515" width="28" height="56" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="4"/>
  <path d="M740 571 C740 680 900 650 1000 720" fill="none" stroke="#DC2626" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

  <!-- vitals card -->
  <rect x="890" y="380" width="250" height="150" rx="30" fill="#fff"/>
  <polyline points="915,470 970,470 990,425 1015,510 1040,455 1060,470 1115,470" fill="none" stroke="#DC2626" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(935 410) scale(0.45)" d="M0 30 C-60 -10 -50 -60 -18 -60 C-6 -60 0 -50 0 -42 C0 -50 6 -60 18 -60 C50 -60 60 -10 0 30 Z" fill="#DC2626"/>

  <circle cx="520" cy="420" r="16" fill="#10B981" opacity="0.5"/>
  <circle cx="1090" cy="250" r="11" fill="#0EA5E9" opacity="0.5"/>
</svg>
